<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="login.title">Login - RTL-SDR Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/dseg@0.46.0/css/dseg.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css?v=19">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('ui_theme');
                if (t === 'v2') document.documentElement.setAttribute('data-theme', 'v2');
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">
                <h1>📡 RTL-SDR Monitor</h1>
                <p>Radio Signal Monitoring System</p>
            </div>

            <!-- Language toggle -->
            <div class="text-center mb-1">
                <button class="lang-toggle-btn" onclick="I18n.toggle()" data-i18n="lang.toggle">🌐 EN</button>
            </div>

            <div id="alert-box" class="hidden"></div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label for="username" data-i18n="login.username">ชื่อผู้ใช้</label>
                    <input type="text" id="username" class="form-input" data-i18n-ph="login.usernamePh" placeholder="กรอกชื่อผู้ใช้" required autocomplete="username" autofocus>
                </div>
                <div class="form-group">
                    <label for="password" data-i18n="login.password">รหัสผ่าน</label>
                    <input type="password" id="password" class="form-input" data-i18n-ph="login.passwordPh" placeholder="กรอกรหัสผ่าน" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="login-btn" data-i18n="login.submit">
                    เข้าสู่ระบบ
                </button>
            </form>

            <div class="text-center mt-2">
                <p class="text-muted" style="font-size: 0.8rem;">
                    <span data-i18n="login.adminHint">🔧 ผู้ดูแลระบบ: </span><code>python -m backend.cli createsuperuser</code>
                </p>
            </div>
        </div>
    </div>

    <script src="/js/i18n.js?v=1"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        // If already logged in, redirect to dashboard
        if (Auth.isAuthenticated()) {
            window.location.href = '/dashboard';
        }

        const loginForm = document.getElementById('login-form');
        const alertBox = document.getElementById('alert-box');
        const loginBtn = document.getElementById('login-btn');

        function showAlert(message, type = 'error') {
            alertBox.className = `alert alert-${type}`;
            alertBox.textContent = message;
            alertBox.classList.remove('hidden');
        }

        function hideAlert() {
            alertBox.classList.add('hidden');
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showAlert(I18n.t('login.fillAll'));
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = I18n.t('login.submitting');

            try {
                const result = await Auth.login(username, password);
                if (result.success) {
                    showAlert(I18n.t('login.success'), 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 500);
                } else {
                    showAlert(result.error || I18n.t('login.failed'));
                    loginBtn.disabled = false;
                    loginBtn.textContent = I18n.t('login.submit');
                }
            } catch (err) {
                showAlert(I18n.t('login.connError'));
                loginBtn.disabled = false;
                loginBtn.textContent = I18n.t('login.submit');
            }
        });
    </script>
</body>
</html>
