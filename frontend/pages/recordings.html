<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="rec.title">Recordings - RTL-SDR Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/dseg@0.46.0/css/dseg.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css?v=21">
    <script src="/js/i18n.js?v=1"></script>
    <script>
        (function () {
            try {
                var t = localStorage.getItem('ui_theme');
                if (t === 'v2') document.documentElement.setAttribute('data-theme', 'v2');
            } catch (e) {}
        })();
    </script>
    <style>
        .rec-filter-bar {
            display:flex; gap:8px; align-items:center; flex-wrap:wrap;
            margin-bottom:1rem; padding:8px;
            background:rgba(255,255,255,0.03); border-radius:8px;
        }
        .rec-filter-bar select, .rec-filter-bar button, .rec-filter-bar input {
            padding:6px 12px; border-radius:6px;
            background:var(--bg-card); color:var(--text-primary);
            border:1px solid var(--border); font-size:0.85rem;
        }
        .rec-filter-bar button { cursor:pointer; }
        .rec-filter-bar button:hover { background:var(--bg-hover); }
        .rec-filter-bar .spacer { flex:1; }
        .rec-search-input { min-width:200px; }
        .rec-actions { display:flex; gap:4px; }
        .rec-del-btn {
            background:rgba(239,68,68,0.15); color:#fca5a5;
            border:1px solid rgba(239,68,68,0.3);
            padding:2px 8px; border-radius:4px; font-size:0.7rem; cursor:pointer;
        }
        .rec-del-btn:hover { background:rgba(239,68,68,0.3); }
        .rec-stt-btn {
            background:rgba(34,211,238,0.15); color:#7dd3fc;
            border:1px solid rgba(34,211,238,0.3);
            padding:2px 8px; border-radius:4px; font-size:0.7rem; cursor:pointer;
        }
        .rec-stt-btn:hover { background:rgba(34,211,238,0.3); }
        .rec-stt-btn:disabled { opacity:0.5; cursor:wait; }

        /* === Transcript Quality Rating (1=แย่มาก .. 6=ดีที่สุด) === */
        .rec-quality {
            display:flex; flex-direction:column; align-items:center; gap:6px;
            margin-top:8px; padding-top:8px; border-top:1px dashed var(--border);
        }
        .rec-quality .q-label {
            font-size:0.72rem; color:var(--text-muted); text-align:center;
        }
        .rec-quality-btns {
            display:flex; flex-wrap:wrap; justify-content:center; gap:6px;
            max-width:100%;
        }
        .rec-quality-btn {
            min-width:44px; min-height:44px; padding:6px 10px; border-radius:8px;
            font-size:0.72rem; cursor:pointer;
            border:1px solid var(--border); background:transparent; color:var(--text-secondary);
            display:inline-flex; flex-direction:column; align-items:center; justify-content:center;
            gap:2px; transition:all 0.15s; touch-action:manipulation;
        }
        .rec-quality-btn:hover { background:var(--bg-hover); transform:translateY(-1px); }
        .rec-quality-btn .q-emoji { font-size:1.1rem; line-height:1; }
        /* Active colors: 1=red-dark .. 6=green-bright (gradient) */
        .rec-quality-btn[data-rating="1"].active {
            background:rgba(220,38,38,0.28); color:#fca5a5;
            border-color:rgba(220,38,38,0.6); font-weight:600;
        }
        .rec-quality-btn[data-rating="2"].active {
            background:rgba(239,68,68,0.24); color:#fca5a5;
            border-color:rgba(239,68,68,0.55); font-weight:600;
        }
        .rec-quality-btn[data-rating="3"].active {
            background:rgba(251,191,36,0.24); color:#fde68a;
            border-color:rgba(251,191,36,0.55); font-weight:600;
        }
        .rec-quality-btn[data-rating="4"].active {
            background:rgba(132,204,22,0.24); color:#d9f99d;
            border-color:rgba(132,204,22,0.55); font-weight:600;
        }
        .rec-quality-btn[data-rating="5"].active {
            background:rgba(34,197,94,0.24); color:#86efac;
            border-color:rgba(34,197,94,0.55); font-weight:600;
        }
        .rec-quality-btn[data-rating="6"].active {
            background:rgba(16,185,129,0.28); color:#6ee7b7;
            border-color:rgba(16,185,129,0.6); font-weight:600;
        }
        .rec-quality-btn:disabled { opacity:0.5; cursor:wait; }
        .rec-quality-by {
            font-size:0.65rem; color:var(--text-muted); margin-top:2px;
        }
        @media (max-width: 640px) {
            .rec-quality-btn { min-width:48px; min-height:48px; font-size:0.68rem; }
            .rec-quality-btns { gap:8px; }
        }
        .rec-pagination {
            display:flex; gap:8px; align-items:center; justify-content:center;
            margin:1rem 0; flex-wrap:wrap;
        }
        .rec-pagination button {
            padding:6px 12px; border-radius:6px;
            background:var(--bg-card); color:var(--text-primary);
            border:1px solid var(--border); cursor:pointer; font-size:0.85rem;
        }
        .rec-pagination button:hover:not(:disabled) { background:var(--bg-hover); }
        .rec-pagination button:disabled { opacity:0.4; cursor:not-allowed; }
        .rec-pagination .page-info { font-size:0.85rem; color:var(--text-muted); }

        /* === Floating Player Bar === */
        .rec-autoplay-toggle {
            display:flex; align-items:center; gap:6px;
            padding:6px 12px; border-radius:6px;
            background:var(--bg-card); color:var(--text-primary);
            border:1px solid var(--border); cursor:pointer; font-size:0.85rem;
        }
        .rec-autoplay-toggle.on {
            background:rgba(34,197,94,0.18); color:#86efac;
            border-color:rgba(34,197,94,0.4);
        }
        .rec-autoplay-toggle:hover { background:var(--bg-hover); }
        .rec-autoplay-toggle.on:hover { background:rgba(34,197,94,0.28); }
        .rec-queue-badge { font-size:0.75rem; color:var(--text-muted); margin-left:4px; }
        .rec-queue-badge.has { color:#fbbf24; font-weight:600; }

        .rec-play-btn {
            background:rgba(59,130,246,0.15); color:#93c5fd;
            border:1px solid rgba(59,130,246,0.3);
            width:28px; height:28px; border-radius:50%;
            font-size:0.8rem; cursor:pointer; display:inline-flex;
            align-items:center; justify-content:center; padding:0;
            flex-shrink:0;
        }
        .rec-play-btn:hover { background:rgba(59,130,246,0.3); }
        .feed-item.rec-playing {
            background:rgba(34,197,94,0.10);
            border-left:3px solid #22c55e;
            box-shadow:0 0 10px rgba(34,197,94,0.45), inset 2px 0 0 rgba(34,197,94,0.25);
        }

        /* Floating player toolbar at bottom */
        #rec-player-bar {
            position:fixed; left:0; right:0; bottom:0; z-index:200;
            background:var(--bg-elevated, #1f2937);
            border-top:1px solid var(--border, #374151);
            padding:8px 16px; box-shadow:0 -4px 16px rgba(0,0,0,0.4);
            display:flex; align-items:center; gap:12px;
            transform:translateY(120%); transition:transform 0.25s ease;
        }
        #rec-player-bar.visible { transform:translateY(0); }
        #rec-player-bar audio { height:32px; flex:1; min-width:0; }
        #rec-player-info {
            font-size:0.75rem; color:var(--text-secondary);
            min-width:140px; max-width:280px; overflow:hidden;
            text-overflow:ellipsis; white-space:nowrap; line-height:1.3;
        }
        #rec-player-info .pi-title { color:var(--text-primary); font-weight:600; }
        #rec-player-pp {
            background:rgba(59,130,246,0.2); color:#93c5fd;
            border:1px solid rgba(59,130,246,0.4);
            width:36px; height:36px; border-radius:50%;
            font-size:1rem; cursor:pointer; flex-shrink:0;
        }
        #rec-player-pp:hover { background:rgba(59,130,246,0.35); }
        .app-main.rec-has-player { padding-bottom:96px !important; }

        /* === Top-center Toast (non-blocking notification) === */
        .app-toast {
            position:fixed; top:16px; left:50%;
            transform:translateX(-50%) translateY(-8px);
            z-index:9999; max-width:90vw;
            background:rgba(31,41,55,0.96); color:#f3f4f6;
            border:1px solid var(--border, #374151);
            padding:10px 18px; border-radius:8px;
            font-size:0.85rem; line-height:1.4; text-align:center;
            box-shadow:0 8px 24px rgba(0,0,0,0.45);
            opacity:0; transition:opacity 0.2s ease, transform 0.2s ease;
            pointer-events:none;
        }
        .app-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

        /* === Bulk selection (admin) === */
        .rec-select-bar {
            display:flex; gap:10px; align-items:center; flex-wrap:wrap;
            margin-bottom:0.6rem; padding:8px 12px;
            background:rgba(59,130,246,0.08);
            border:1px solid rgba(59,130,246,0.25);
            border-radius:8px;
        }
        .rec-select-bar[hidden] { display:none; }
        .rec-select-bar .spacer { flex:1; }
        .rec-select-all-label {
            display:inline-flex; align-items:center; gap:6px; cursor:pointer;
            font-size:0.85rem; user-select:none;
        }
        .rec-bulk-delete-btn {
            background:rgba(239,68,68,0.18); color:#fca5a5;
            border:1px solid rgba(239,68,68,0.4);
            padding:6px 14px; border-radius:6px; font-size:0.85rem; cursor:pointer;
        }
        .rec-bulk-delete-btn:hover:not(:disabled) { background:rgba(239,68,68,0.32); }
        .rec-bulk-delete-btn:disabled { opacity:0.4; cursor:not-allowed; }
        .rec-clear-sel-btn {
            background:transparent; color:var(--text-muted);
            border:1px solid var(--border);
            padding:6px 12px; border-radius:6px; font-size:0.8rem; cursor:pointer;
        }
        .rec-clear-sel-btn:hover { background:var(--bg-hover); }
        .rec-row-checkbox {
            width:18px; height:18px; cursor:pointer; accent-color:#3b82f6;
            flex-shrink:0; margin:0;
        }
        .feed-item.rec-selected {
            background:rgba(59,130,246,0.12) !important;
            border-left:3px solid #3b82f6;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <a href="/dashboard" class="header-logo">📡 RTL-SDR Monitor</a>
            </div>
            <div class="header-right">
                <a href="/dashboard" class="btn btn-sm" data-i18n="nav.back">← กลับ</a>
                <button class="lang-toggle-btn" onclick="I18n.toggle()" data-i18n="lang.toggle">🌐 EN</button>
                <a href="/settings" class="btn btn-sm" data-i18n="nav.settings">⚙️ ตั้งค่า</a>
                <button class="btn btn-sm" onclick="Auth.logout()" data-i18n="nav.logout">ออกจากระบบ</button>
            </div>
        </header>
        <div class="app-main" style="padding: 2rem; overflow-y: auto;">
            <h2 style="margin-bottom: 1rem;" data-i18n="rec.pageTitle">📋 รายการบันทึกทั้งหมด</h2>

            <div class="rec-filter-bar">
                <label style="font-size:0.85rem;" data-i18n="rec.filterSource">ประเภท:</label>
                <select id="filter-source" onchange="onSourceChange()">
                    <option value="" data-i18n="rec.sourceAll">ทั้งหมด</option>
                    <option value="auto" data-i18n="rec.sourceAuto">🔵 อัดอัตโนมัติ</option>
                    <option value="manual" data-i18n="rec.sourceManual">🟢 อัดด้วยตนเอง</option>
                    <option value="auto_job" data-i18n="rec.sourceAutoJob">🟣 อัดตามกำหนดการ</option>
                </select>
                <label style="font-size:0.85rem;" data-i18n="rec.filterDevice">อุปกรณ์:</label>
                <select id="filter-device" onchange="resetAndLoad()">
                    <option value="" data-i18n="rec.allDevices">ทุกอุปกรณ์</option>
                </select>
                <label style="font-size:0.85rem;" data-i18n="rec.filterFreq">ความถี่:</label>
                <select id="filter-frequency" onchange="resetAndLoad()">
                    <option value="" data-i18n="rec.allFreqs">ทุกความถี่</option>
                </select>
                <input type="text" id="search-input" class="rec-search-input"
                       data-i18n-ph="rec.searchPh" placeholder="🔍 ค้นหา (ข้อความถอดเสียง, ความถี่ MHz, โหมด, ชื่อไฟล์)"
                       oninput="onSearchInput(this.value)" />
                <label style="font-size:0.85rem;" data-i18n="rec.perPage">ต่อหน้า:</label>
                <select id="page-size" onchange="onPageSizeChange(this.value)">
                    <option value="10">10</option>
                    <option value="25">25</option>
                    <option value="50" selected>50</option>
                    <option value="100">100</option>
                </select>
                <span class="spacer"></span>
                <span id="rec-count" style="font-size:0.85rem; color:var(--text-muted);">--</span>
                <span id="rec-total-duration" style="font-size:0.85rem; color:var(--text-muted);"></span>
                <span id="rec-total-size" style="font-size:0.85rem; color:var(--text-muted);"></span>
                <button id="rec-autoplay-btn" class="rec-autoplay-toggle" onclick="RecAudioQueue.toggleAutoplay()" data-i18n-title="rec.autoplayTitle" title="เปิด/ปิดการเล่นรายการล่าสุดอัตโนมัติ">
                    <span id="rec-autoplay-icon">🔇</span>
                    <span id="rec-autoplay-label" data-i18n="rec.autoPlay">เล่นอัตโนมัติ</span>
                    <span id="rec-queue-badge" class="rec-queue-badge"></span>
                </button>
            </div>

            <!-- === Bulk selection bar (admin only) === -->
            <div id="rec-select-bar" class="rec-select-bar" hidden>
                <label class="rec-select-all-label" data-i18n-title="rec.selectAllTitle" title="เลือก/ยกเลิกทุกรายการในหน้านี้">
                    <input type="checkbox" id="rec-select-all" class="rec-row-checkbox" onchange="onSelectAllChange(this.checked)">
                    <span data-i18n="rec.selectAll">เลือกทั้งหมด</span>
                </label>
                <span id="rec-selected-count" style="font-size:0.8rem; color:var(--text-muted);">เลือก 0 รายการ</span>
                <span class="spacer"></span>
                <button class="rec-clear-sel-btn" onclick="clearSelection()" data-i18n="rec.clearSel">ยกเลิกการเลือก</button>
                <button id="rec-bulk-delete-btn" class="rec-bulk-delete-btn" onclick="bulkDeleteSelected()" disabled>🗑 ลบรายการที่เลือก (0)</button>
            </div>

            <div id="recordings-list" class="text-center text-muted p-2">
                <span data-i18n="common.loading">กำลังโหลด...</span>
            </div>

            <div id="pagination" class="rec-pagination" style="display:none;">
                <button id="page-first" onclick="goToPage(1)" data-i18n-title="rec.firstPageTitle" title="หน้าแรก">«</button>
                <button id="page-prev" onclick="changePage(-1)" data-i18n-title="rec.prev" title="ก่อนหน้า"><span data-i18n="rec.prev">‹ ก่อนหน้า</span></button>
                <span class="page-info" id="page-info">--</span>
                <button id="page-next" onclick="changePage(1)" data-i18n-title="rec.next" title="ถัดไป"><span data-i18n="rec.next">ถัดไป ›</span></button>
                <button id="page-last" onclick="goToLastPage()" data-i18n-title="rec.lastPageTitle" title="หน้าสุดท้าย">»</button>
            </div>
        </div>

        <!-- === Floating Player Bar (sibling of app-main) === -->
        <div id="rec-player-bar">
            <button id="rec-player-pp" onclick="RecAudioQueue.toggleCurrentPlayPause()" title="เล่น/หยุด">▶</button>
            <div id="rec-player-info"><span class="pi-title">--</span></div>
            <audio id="rec-player-audio" controls preload="metadata"></audio>
        </div>
    </div>
    <script src="/js/api.js?v=12"></script>
    <script src="/js/auth.js?v=5"></script>
    <script src="/js/websocket.js?v=6"></script>
    <script>
        if (!Auth.isAuthenticated()) window.location.href = '/login';

        const REFRESH_INTERVAL_MS = 10000; // auto-refresh ทุก 10 วินาที
        const SEARCH_DEBOUNCE_MS = 400;    // debounce การค้นหา
        let _page = 1;            // หน้าปัจจุบัน (1-based)
        let _pageSize = 50;       // จำนวนรายการต่อหน้า
        let _total = 0;           // จำนวนรายการทั้งหมดที่ตรง filter/search
        let _totalDuration = 0;   // ระยะเวลารวม (วินาที) ของรายการทั้งหมดที่ตรง filter/search
        let _totalFileSize = 0;   // ขนาดไฟล์รวม (bytes) ของรายการทั้งหมดที่ตรง filter/search
        let _allItems = [];       // รายการในหน้าปัจจุบัน
        let _recCache = new Map(); // id -> rec (สำหรับ diff reconciliation)
        let _refreshTimer = null;
        let _searchTimer = null;
        let _loading = false;
        let _selectedIds = new Set(); // id ของรายการที่ติ๊กเลือก (สำหรับ bulk delete)

        // === Utility: format duration (seconds → human readable) ===
        function formatDuration(sec) {
            if (!sec || sec <= 0) return '0s';
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = Math.round(sec % 60);
            if (I18n.lang === 'th') {
                if (h > 0) return `${h}ชม ${m}น ${s}วิ`;
                if (m > 0) return `${m}น ${s}วิ`;
                return `${s}วิ`;
            }
            if (h > 0) return `${h}h ${m}m ${s}s`;
            if (m > 0) return `${m}m ${s}s`;
            return `${s}s`;
        }

        // === Utility: format file size (bytes → human readable) ===
        function formatFileSize(bytes) {
            if (!bytes || bytes <= 0) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.min(units.length - 1, Math.floor(Math.log(bytes) / Math.log(1024)));
            const val = bytes / Math.pow(1024, i);
            // B ไม่มีทศนิยม; หน่วยใหญ่ขึ้นแสดง 1 ตำแหน่ง
            return `${i === 0 ? val : val.toFixed(1)} ${units[i]}`;
        }

        // === Utility: toast notification (top-center, auto-dismiss) ===
        let _toastTimer = null;
        function showToast(message, durationMs) {
            durationMs = durationMs || 2500;
            let el = document.getElementById('app-toast');
            if (!el) {
                el = document.createElement('div');
                el.id = 'app-toast';
                el.className = 'app-toast';
                document.body.appendChild(el);
            }
            el.textContent = message;
            // force reflow ก่อนเพิ่ม class เพื่อให้ transition ทำงาน
            requestAnimationFrame(() => { el.classList.add('show'); });
            if (_toastTimer) clearTimeout(_toastTimer);
            _toastTimer = setTimeout(() => { el.classList.remove('show'); }, durationMs);
        }

        // === HTML builders ===

        // สร้าง HTML ของแถวรายการ (ใช้ทั้งตอนสร้างใหม่และตอนอัพเดต field)
        function recHTML(rec) {
            const userTz = getUserTimezone();
            const time = rec.recorded_at
                ? formatDateTime(rec.recorded_at, userTz, {
                    day:'2-digit', month:'2-digit', year:'numeric',
                    hour:'2-digit', minute:'2-digit'
                  })
                : (rec.timestamp ? formatDateTime(rec.timestamp, userTz) : '--');
            const freq = rec.frequency_mhz
                ? rec.frequency_mhz.toFixed(4) + ' MHz'
                : (rec.frequency ? (rec.frequency / 1e6).toFixed(4) + ' MHz' : '');
            const mode = rec.mode || '';
            const dur = rec.duration ? rec.duration.toFixed(1) + 's' : '';
            const sigVal = rec.signal_strength != null ? rec.signal_strength : rec.signal_level;
            const sig = sigVal != null ? sigVal.toFixed(0) + ' dB' : '';
            const metaHtml = `<span class="rec-meta" style="font-size:0.75rem; color:var(--text-secondary); margin-right:8px;">${freq} ${mode} | ${dur} | ${sig}</span>`;
            const btnHtml = sttBtnHTML(rec);
            const source = rec.source || 'auto';
            // Source badge: auto=🔵, manual=🟢, auto_job=🟣
            const badgeClass = source === 'manual' ? 'manual' : 'auto';
            const recorderName = rec.recorded_by_username || '';
            const deviceName = rec.device_name || '';
            const SOURCE_BADGES = {
                'auto':     { label: '🔵 ' + I18n.t('rec.sourceAuto'),     title: I18n.t('rec.sourceAutoTitle') },
                'manual':   { label: '🟢 ' + I18n.t('rec.sourceManual'),   title: I18n.t('rec.sourceManualTitle') },
                'auto_job': { label: '🟣 ' + I18n.t('rec.sourceAutoJob'),  title: I18n.t('rec.sourceAutoJobTitle') },
            };
            const sb = SOURCE_BADGES[source] || SOURCE_BADGES['auto'];
            const badgeLabel = sb.label;
            const badgeTitle = sb.title + (source === 'manual' && recorderName ? `: ${recorderName}` : '');
            const recorderBadge = (source === 'manual' && recorderName)
                ? `<span class="rec-recorder" title="${I18n.t('rec.recordedBy')} ${recorderName}" style="font-size:0.7rem; color:var(--text-muted); background:rgba(34,211,238,0.08); border:1px solid var(--border); padding:2px 8px; border-radius:4px;">👤 ${recorderName}</span>`
                : '';
            const deviceBadge = deviceName
                ? `<span class="rec-device" title="${I18n.t('rec.deviceTitle')}" style="font-size:0.7rem; color:var(--text-muted); background:rgba(168,85,247,0.08); border:1px solid var(--border); padding:2px 8px; border-radius:4px;">📺 ${deviceName}</span>`
                : '';
            const transcriptHtml = transcriptHTML(rec);
            const hasAudio = rec.has_audio != null ? rec.has_audio : (!!(rec.audio_file_name || rec.url) && !rec.audio_deleted);
            const audioUrl = hasAudio
                ? (rec.audio_file_name ? '/recordings/' + rec.audio_file_name : (rec.url || ''))
                : '';
            const audioDeletedBadge = rec.audio_deleted
                ? `<span class="rec-audio-deleted-badge" title="${I18n.t('rec.audioDeletedTitle')}" style="font-size:0.7rem; color:var(--text-muted); background:rgba(156,163,175,0.15); border:1px solid var(--border); padding:2px 8px; border-radius:4px; margin-left:4px;">🔇 ${I18n.t('rec.audioDeleted')}</span>`
                : '';
            // checkbox เลือกรายการ (admin เท่านั้น) สำหรับ bulk delete
            const selectCb = Auth.isAdmin()
                ? `<input type="checkbox" class="rec-row-checkbox rec-row-select" data-rec-id="${rec.id}" onchange="onRowSelectChange('${rec.id}', this.checked)" title="${I18n.t('rec.selectRow')}">`
                : '';

            return `
                <div class="feed-item" id="rec-${rec.id}" data-rec-id="${rec.id}" data-recorded-at="${rec.recorded_at || rec.timestamp || ''}" style="margin-bottom: 8px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
                        <div style="display:flex; gap:8px; align-items:center;">
                            ${selectCb}
                            <span class="source-badge ${badgeClass}" title="${badgeTitle}">${badgeLabel}</span>
                            ${recorderBadge}
                            ${deviceBadge}
                            <span class="rec-time" style="font-family:var(--font-mono); font-size:0.8rem; color:var(--text-muted);">${time}</span>
                            ${audioDeletedBadge}
                        </div>
                        <div class="rec-actions">
                            ${metaHtml}
                            ${btnHtml}
                            ${Auth.isAdmin() ? `<button class="rec-del-btn" onclick="deleteRec('${rec.id}')">🗑 ${I18n.t('rec.deleteBtn')}</button>` : ''}
                        </div>
                    </div>
                    <div class="feed-text" style="margin-top:6px;">
                        <div class="transcript" id="transcript-${rec.id}" style="font-size:0.85rem; line-height:1.5;">${transcriptHtml}</div>
                    </div>
                    ${qualityHTML(rec)}
                    ${audioUrl ? `<button class="rec-play-btn" data-rec-id="${rec.id}" onclick="RecAudioQueue.toggleRow('${rec.id}')" title="${I18n.t('rec.playStop')}">▶</button>` : ''}
                </div>
            `;
        }

        // สร้าง HTML ของ provider badge (มีไอคอน) — ใช้ทั้งใน recordings.html และ dashboard
        const PROVIDER_ICONS = {
            speechmatics: '🔊',
            azure: '☁️',
            whisper: '🤫',
            whisper_local: '🤫',
        };
        // Human-friendly label for each provider
        const PROVIDER_LABELS = {
            speechmatics: 'Speechmatics',
            azure: 'Azure',
            whisper: 'Whisper',
            whisper_local: 'Whisper',
        };
        function providerBadgeHTML(rec) {
            const p = rec.stt_provider;
            if (!p) return '';
            const icon = PROVIDER_ICONS[p] || '📝';
            const label = PROVIDER_LABELS[p] || (p.charAt(0).toUpperCase() + p.slice(1));
            // For Whisper, append the model name if available (e.g. "Whisper · Systran/faster-whisper-small")
            const isWhisper = (p === 'whisper' || p === 'whisper_local');
            const model = isWhisper && rec.stt_model ? ` · ${rec.stt_model}` : '';
            const sttDur = (rec.stt_duration != null) ? ` · ⏱ ${Number(rec.stt_duration).toFixed(1)}s` : '';
            return `<span style="font-size:0.65rem; color:var(--text-muted); margin-left:6px; white-space:nowrap;">${icon} ${label}${model}${sttDur}</span>`;
        }

        // สร้าง HTML ของส่วน transcript (แยกไว้เพื่อ re-render ตอน diff)
        function transcriptHTML(rec) {
            const hasTranscript = !!(rec.transcript || rec.transcription);
            const providerBadge = providerBadgeHTML(rec);
            const errorBadge = rec.stt_error
                ? `<div style="font-size:0.7rem; color:var(--accent-red); margin-top:4px;" title="${(rec.stt_error||'').replace(/"/g,'"')}">⚠️ ${rec.stt_error.length > 80 ? rec.stt_error.slice(0,80) + '…' : rec.stt_error}</div>`
                : '';
            if (hasTranscript) {
                return `<div>${(rec.transcript || rec.transcription)}</div>${providerBadge}${errorBadge}`;
            }
            return rec.stt_error ? errorBadge : `<span class="text-muted">${I18n.t('rec.notTranscribed')}</span>`;
        }

        // สร้าง HTML ของปุ่มถอดเสียง (แยกไว้เพื่อ re-render ตอน diff)
        function sttBtnHTML(rec) {
            const hasTranscript = !!(rec.transcript || rec.transcription);
            const hasAudio = rec.has_audio != null ? rec.has_audio : (!!(rec.audio_file_name || rec.url) && !rec.audio_deleted);
            // ถ้าไม่มีไฟล์เสียง → ซ่อนปุ่ม (ไม่สามารถถอดได้)
            if (!hasAudio) return '';
            return `<button class="rec-stt-btn" id="stt-btn-${rec.id}" onclick="transcribeRec('${rec.id}')" ${hasTranscript ? `disabled title="${I18n.t('rec.transcribedBtn')}"` : ''}>${hasTranscript ? I18n.t('rec.transcribedBtn') : I18n.t('rec.transcribe')}</button>`;
        }

        // สร้าง HTML ของปุ่มให้คะแนนคุณภาพการถอดเสียง (1=แย่มาก .. 6=ดีที่สุด)
        // แสดงเฉพาะรายการที่มี transcript แล้วเท่านั้น (ตามที่ผู้ใช้ยืนยัน)
        const QUALITY_RATINGS = [
            { rating: 6, emoji: '🤩', label: () => I18n.t('rec.qualityBest') },
            { rating: 5, emoji: '👍', label: () => I18n.t('rec.qualityGreat') },
            { rating: 4, emoji: '🙂', label: () => I18n.t('rec.qualityGood') },
            { rating: 3, emoji: '😐', label: () => I18n.t('rec.qualityOkay') },
            { rating: 2, emoji: '👎', label: () => I18n.t('rec.qualityBad') },
            { rating: 1, emoji: '😡', label: () => I18n.t('rec.qualityWorst') },
        ];
        function qualityHTML(rec) {
            const hasTranscript = !!(rec.transcript || rec.transcription);
            if (!hasTranscript) return '';
            const current = rec.quality_rating != null ? Number(rec.quality_rating) : null;
            const ratedBy = rec.quality_rated_by_username || '';
            const byBadge = (current != null && ratedBy)
                ? `<span class="rec-quality-by" title="${I18n.t('rec.qualityByTitle', ratedBy)}">${I18n.t('rec.qualityBy', ratedBy)}</span>`
                : '';
            // ปุ่มที่ active = ค่าปัจจุบัน
            const lblOf = (item) => (typeof item.label === 'function' ? item.label() : item.label);
            const btn = (item) => {
                const lbl = lblOf(item);
                return `
                <button class="rec-quality-btn ${current === item.rating ? 'active' : ''}"
                        data-rating="${item.rating}"
                        onclick="markQuality('${rec.id}', ${item.rating})"
                        title="${lbl}">
                    <span class="q-emoji">${item.emoji}</span>
                    <span>${lbl}</span>
                </button>`;
            };
            return `
                <div class="rec-quality" id="quality-${rec.id}">
                    <span class="q-label">${I18n.t('rec.qualityLabel')}</span>
                    <div class="rec-quality-btns">
                        ${QUALITY_RATINGS.map(btn).join('')}
                    </div>
                    ${byBadge}
                </div>
            `;
        }

        // === Keyed reconciliation (diff + patch DOM โดยไม่ rebuild <audio>) ===

        // อัพเดต field ที่เปลี่ยนในแถวที่มีอยู่แล้ว โดยไม่ทำลาย <audio> element
        function updateRowFields(rowEl, oldRec, newRec) {
            // เปรียบเทียบ field ที่อาจเปลี่ยนและอัพเดตเฉพาะส่วนนั้น
            const audioDeletedChanged = (oldRec.audio_deleted ?? false) !== (newRec.audio_deleted ?? false);
            const fields = ['transcript','transcription','stt_provider','stt_model','stt_error','stt_duration'];
            const sttChanged = audioDeletedChanged || fields.some(f => (oldRec[f] ?? null) !== (newRec[f] ?? null));
            if (sttChanged) {
                const trEl = rowEl.querySelector('.transcript');
                if (trEl) trEl.innerHTML = transcriptHTML(newRec);
                const btnContainer = rowEl.querySelector('.rec-actions');
                const oldBtn = btnContainer && btnContainer.querySelector('.rec-stt-btn');
                if (oldBtn && btnContainer) {
                    oldBtn.outerHTML = sttBtnHTML(newRec);
                }
            }
            // signal/duration/meta
            const metaChanged = ['signal_strength','signal_level','duration','frequency_mhz','frequency','mode']
                .some(f => (oldRec[f] ?? null) !== (newRec[f] ?? null));
            if (metaChanged) {
                const metaEl = rowEl.querySelector('.rec-meta');
                if (metaEl) {
                    const freq = newRec.frequency_mhz
                        ? newRec.frequency_mhz.toFixed(4) + ' MHz'
                        : (newRec.frequency ? (newRec.frequency / 1e6).toFixed(4) + ' MHz' : '');
                    const mode = newRec.mode || '';
                    const dur = newRec.duration ? newRec.duration.toFixed(1) + 's' : '';
                    const sigVal = newRec.signal_strength != null ? newRec.signal_strength : newRec.signal_level;
                    const sig = sigVal != null ? sigVal.toFixed(0) + ' dB' : '';
                    metaEl.textContent = `${freq} ${mode} | ${dur} | ${sig}`;
                }
            }
            // quality rating — re-render the whole quality block if it changed.
            // Also handles the case where transcript just appeared (was hidden,
            // now should show) since qualityHTML() depends on hasTranscript.
            const qualityFields = ['quality_rating','quality_rated_by_username','quality_rated_at'];
            const oldHasTranscript = !!(oldRec.transcript || oldRec.transcription);
            const newHasTranscript = !!(newRec.transcript || newRec.transcription);
            const transcriptAppeared = !oldHasTranscript && newHasTranscript;
            const qualityChanged = transcriptAppeared
                || qualityFields.some(f => (oldRec[f] ?? null) !== (newRec[f] ?? null));
            if (qualityChanged) {
                const oldQ = rowEl.querySelector('.rec-quality');
                const newQHtml = qualityHTML(newRec);
                if (oldQ) {
                    // มีอยู่แล้ว → อัพเดต (หรือลบถ้า transcript หายไป)
                    if (newQHtml) oldQ.outerHTML = newQHtml;
                    else oldQ.remove();
                } else if (newQHtml) {
                    // ยังไม่มี → แทรกใต้ transcript (ก่อนปุ่ม play ถ้ามี)
                    const playBtn = rowEl.querySelector('.rec-play-btn');
                    if (playBtn) playBtn.insertAdjacentHTML('beforebegin', newQHtml);
                    else rowEl.insertAdjacentHTML('beforeend', newQHtml);
                }
            }
        }

        // Reconcile: ปรับ DOM ให้ตรงกับ items โดย preserve <audio> ที่กำลังเล่น
        function applyRecordings(items) {
            const container = document.getElementById('recordings-list');
            const newIds = new Set(items.map(r => r.id));
            const newCache = new Map(items.map(r => [r.id, r]));

            // ลบแถวที่ไม่มีใน list ใหม่
            const existingRows = Array.from(container.querySelectorAll('.feed-item'));
            for (const row of existingRows) {
                const id = row.id.replace('rec-', '');
                if (!newIds.has(id)) {
                    row.remove();
                }
            }

            // จัดเรียง/เพิ่ม/อัพเดต ตามลำดับของ items
            let refNode = container.firstChild; // cursor สำหรับ insertBefore
            for (const rec of items) {
                const expectedId = `rec-${rec.id}`;
                // หาแถวที่มีอยู่แล้ว
                let rowEl = container.querySelector(`#rec-${CSS.escape(rec.id)}`);

                if (rowEl) {
                    // มีอยู่แล้ว → อัพเดต field ถ้าเปลี่ยน, แล้วย้ายตำแหน่งถ้าจำเป็น
                    const oldRec = _recCache.get(rec.id);
                    if (oldRec) updateRowFields(rowEl, oldRec, rec);
                    if (rowEl !== refNode) {
                        container.insertBefore(rowEl, refNode);
                    } else {
                        refNode = refNode.nextSibling;
                    }
                } else {
                    // แถวใหม่ → สร้างแล้ว insert ก่อน refNode
                    const wrapper = document.createElement('div');
                    wrapper.innerHTML = recHTML(rec).trim();
                    const newRow = wrapper.firstChild;
                    container.insertBefore(newRow, refNode);
                    // refNode ยังชี้ที่เดิม (แถวใหม่แทรกก่อนหน้า)
                }
            }

            // ลบข้อความ placeholder ถ้ามี (เช่น "ยังไม่มีรายการบันทึก")
            if (items.length > 0) {
                const placeholder = container.querySelector('p.text-muted');
                if (placeholder && !placeholder.closest('.feed-item')) {
                    placeholder.remove();
                }
            }

            _recCache = newCache;
            _allItems = items;
        }

        // === Frequency dropdown ===

        async function loadFrequencies() {
            const select = document.getElementById('filter-frequency');
            const currentVal = select.value; // preserve selection
            const source = document.getElementById('filter-source').value;
            try {
                const data = await API.recordings.listFrequencies({
                    source: source || undefined,
                });
                const items = data.items || [];
                // rebuild options แบบ preserve ค่าที่เลือกไว้ (ถ้ายังมีอยู่)
                select.innerHTML = '<option value="">ทุกความถี่</option>';
                for (const item of items) {
                    const opt = document.createElement('option');
                    opt.value = item.frequency_mhz;
                    opt.textContent = `${item.frequency_mhz.toFixed(4)} MHz (${item.count})`;
                    select.appendChild(opt);
                }
                // ถ้าค่าเดิมยังอยู่ใน list ให้เลือกคืน
                if (currentVal && Array.from(select.options).some(o => o.value === currentVal)) {
                    select.value = currentVal;
                } else if (currentVal) {
                    // ค่าที่เลือกไว้หายไปจาก list → reset แล้ว reload
                    select.value = '';
                }
            } catch (e) {
                console.warn('Failed to load frequencies:', e);
            }
        }

        async function onSourceChange() {
            // เมื่อเปลี่ยน source ให้ re-fetch frequency options (sync) แล้วค่อย load
            await loadFrequencies();
            resetAndLoad();
        }

        // === Data loading ===

        async function loadRecordings() {
            if (_loading) return; // กัน fetch ซ้อนทับ
            _loading = true;
            const source = document.getElementById('filter-source').value;
            const search = document.getElementById('search-input').value.trim();
            const freqVal = document.getElementById('filter-frequency').value;
            const frequencyMhz = freqVal ? parseFloat(freqVal) : null;
            const deviceId = document.getElementById('filter-device').value || undefined;
            const offset = (_page - 1) * _pageSize;
            try {
                const data = await API.recordings.list({
                    limit: _pageSize,
                    offset: offset,
                    source: source || undefined,
                    search: search || undefined,
                    frequency_mhz: isNaN(frequencyMhz) ? undefined : frequencyMhz,
                    device_id: deviceId,
                });
                const items = data.items || [];
                _total = data.total || 0;
                _totalDuration = data.total_duration || 0;
                _totalFileSize = data.total_file_size || 0;
                const container = document.getElementById('recordings-list');

                if (!items.length) {
                    container.innerHTML = `<p class="text-muted">${I18n.t('rec.noRecordings')}</p>`;
                    _recCache.clear();
                    _allItems = [];
                } else {
                    // ถ้าเป็นการโหลดหน้า/หน้าที่เปลี่ยน → rebuild (เพราะเป็นคนละเซ็ตรายการ)
                    // ถ้าเป็น refresh หน้าเดิม → reconcile (preserve audio)
                    const sameSet = _allItems.length > 0 && items.every((it, i) => _allItems[i] && _allItems[i].id === it.id);
                    if (sameSet) {
                        applyRecordings(items);
                    } else {
                        container.innerHTML = items.map(recHTML).join('');
                        _recCache = new Map(items.map(r => [r.id, r]));
                        _allItems = items;
                    }
                }

                updateCountAndPagination();
                if (typeof RecAudioQueue !== 'undefined') RecAudioQueue.refreshRowButtons();
                syncSelectionUI();
            } catch (err) {
                console.error('Failed to load recordings:', err);
                // แสดง error เฉพาะตอนที่ยังไม่มีข้อมูล (silent refresh ไม่โชว์)
                if (_allItems.length === 0) {
                    document.getElementById('recordings-list').innerHTML =
                        '<p class="text-muted">' + I18n.t('rec.loadError') + (err.detail || err.message || err) + '</p>';
                }
            } finally {
                _loading = false;
            }
        }

        function updateCountAndPagination() {
            document.getElementById('rec-count').textContent =
                `${_allItems.length} / ${_total} รายการ`;
            document.getElementById('rec-total-duration').textContent =
                _totalDuration > 0 ? `⏱ ${formatDuration(_totalDuration)}` : '';
            document.getElementById('rec-total-size').textContent =
                _totalFileSize > 0 ? `💾 ${formatFileSize(_totalFileSize)}` : '';
            const totalPages = Math.max(1, Math.ceil(_total / _pageSize));
            const pag = document.getElementById('pagination');
            if (_total === 0) {
                pag.style.display = 'none';
                return;
            }
            pag.style.display = '';
            document.getElementById('page-info').textContent = `${I18n.t('rec.page')} ${_page} / ${totalPages}`;
            document.getElementById('page-prev').disabled = (_page <= 1);
            document.getElementById('page-first').disabled = (_page <= 1);
            document.getElementById('page-next').disabled = (_page >= totalPages);
            document.getElementById('page-last').disabled = (_page >= totalPages);
        }

        // === Controls ===

        function resetAndLoad() {
            _page = 1;
            loadRecordings();
        }

        function changePage(delta) {
            const totalPages = Math.max(1, Math.ceil(_total / _pageSize));
            const newPage = Math.min(Math.max(1, _page + delta), totalPages);
            if (newPage === _page) return;
            _page = newPage;
            loadRecordings();
        }

        function goToPage(p) {
            const totalPages = Math.max(1, Math.ceil(_total / _pageSize));
            _page = Math.min(Math.max(1, p), totalPages);
            loadRecordings();
        }

        function goToLastPage() {
            const totalPages = Math.max(1, Math.ceil(_total / _pageSize));
            goToPage(totalPages);
        }

        function onPageSizeChange(val) {
            _pageSize = parseInt(val) || 50;
            // พยายามรักษาตำแหน่งหน้าใกล้เคียงเดิม
            const firstItemIdx = (_page - 1) * _pageSize;
            _page = Math.floor(firstItemIdx / _pageSize) + 1;
            _page = Math.max(1, _page);
            loadRecordings();
        }

        function onSearchInput(val) {
            if (_searchTimer) clearTimeout(_searchTimer);
            _searchTimer = setTimeout(() => {
                resetAndLoad();
            }, SEARCH_DEBOUNCE_MS);
        }

        async function transcribeRec(id) {
            const btn = document.getElementById('stt-btn-' + id);
            const transcriptEl = document.getElementById('transcript-' + id);
            if (btn) { btn.disabled = true; btn.textContent = I18n.t('rec.transcribingBtn'); }
            if (transcriptEl) transcriptEl.innerHTML = `<span class="text-muted">${I18n.t('rec.transcribeWait')}</span>`;
            try {
                const result = await API.recordings.transcribe(id);
                const text = result.transcript || I18n.t('rec.transcribeNoResult');
                // อัพเดต cache ก่อน เพื่อให้ transcriptHTML() ดึง provider ทันที
                const cached = _recCache.get(id);
                if (cached) {
                    cached.transcript = text;
                    cached.stt_provider = result.provider || cached.stt_provider;
                    cached.stt_model = result.model || cached.stt_model;
                    cached.stt_error = result.error || cached.stt_error;
                    cached.stt_duration = result.stt_duration != null ? result.stt_duration : cached.stt_duration;
                    // Re-render ผ่าน transcriptHTML() เพื่อแสดงข้อความ + provider badge + error พร้อมกัน
                    if (transcriptEl) transcriptEl.innerHTML = transcriptHTML(cached);
                } else if (transcriptEl) {
                    // Fallback ถ้าไม่มี cache
                    if (transcriptEl) transcriptEl.textContent = text;
                }
                if (btn) { btn.textContent = I18n.t('rec.transcribedBtn'); btn.disabled = true; }
            } catch (err) {
                if (transcriptEl) transcriptEl.innerHTML = `<span style="color:var(--accent-red);">${I18n.t('rec.transcribeFail', err.detail || err.message || err)}</span>`;
                if (btn) { btn.disabled = false; btn.textContent = I18n.t('rec.transcribe'); }
                console.error('Transcribe failed:', err);
            }
        }

        // ให้คะแนนคุณภาพการถอดเสียง (1=แย่มาก .. 6=ดีที่สุด)
        async function markQuality(id, rating) {
            // การให้คะแนนคุณภาพการถอดเสียง สำหรับผู้ดูแลระบบเท่านั้น
            if (!Auth.isAdmin()) {
                showToast(I18n.t('rec.qualityAdminOnly'));
                return;
            }
            // ปุ่มที่กด + ปุ่มทั้งหมดในกลุ่ม → ล็อคชั่วคราวกันกดซ้อน
            const group = document.getElementById('quality-' + id);
            const buttons = group ? group.querySelectorAll('.rec-quality-btn') : [];
            // rating เป็น int; data-rating เป็น string → เปรียบเทียบแบบ string
            const ratingStr = String(rating);
            // optimistic UI: active ทันที (สมมติว่าสำเร็จ)
            if (group) {
                buttons.forEach(b => {
                    b.disabled = true;
                    b.classList.toggle('active', b.getAttribute('data-rating') === ratingStr);
                });
            }
            try {
                const result = await API.recordings.setQuality(id, rating);
                // อัพเดต cache เพื่อให้ reconciliation คงสถานะ active ไว้
                const cached = _recCache.get(id);
                if (cached) {
                    cached.quality_rating = result.quality_rating != null ? result.quality_rating : rating;
                    cached.quality_rated_by_username = result.quality_rated_by_username || cached.quality_rated_by_username;
                }
                // รีเรนเดอร์ badge "โดย <username>" ถ้ายังไม่มี
                if (group) {
                    const existing = group.querySelector('.rec-quality-by');
                    const byName = result.quality_rated_by_username || '';
                    if (byName) {
                        const badgeHtml = `<span class="rec-quality-by" title="${I18n.t('rec.qualityByTitle', byName)}">${I18n.t('rec.qualityBy', byName)}</span>`;
                        if (existing) existing.outerHTML = badgeHtml;
                        else group.insertAdjacentHTML('beforeend', badgeHtml);
                    }
                }
            } catch (err) {
                // rollback: คืน active state กลับเป็นค่าเดิมใน cache
                if (group) {
                    const cached = _recCache.get(id);
                    const prev = (cached && cached.quality_rating != null) ? String(cached.quality_rating) : '';
                    buttons.forEach(b => {
                        b.disabled = false;
                        b.classList.toggle('active', b.getAttribute('data-rating') === prev);
                    });
                }
                alert(I18n.t('rec.qualitySaveFail') + (err.detail || err.message || err));
                console.error('markQuality failed:', err);
            } finally {
                if (group) buttons.forEach(b => { b.disabled = false; });
            }
        }

        async function deleteRec(id) {
            if (!confirm(I18n.t('rec.deleteSingleConfirm'))) return;
            try {
                await API.recordings.delete(id);
                _selectedIds.delete(id);
                _total = Math.max(0, _total - 1);
                // หากกำลังเล่น/อยู่ในคิว ของรายการที่ถูกลบ → กำจัดออกจาก player/คิว
                if (typeof RecAudioQueue !== 'undefined') {
                    if (RecAudioQueue.current && RecAudioQueue.current.id === id) {
                        RecAudioQueue.current = null;
                        try { RecAudioQueue._audio.pause(); RecAudioQueue._audio.removeAttribute('src'); RecAudioQueue._audio.load(); } catch (e) {}
                        RecAudioQueue._isPlaying = false;
                    }
                    RecAudioQueue.pending = RecAudioQueue.pending.filter(p => p.id !== id);
                    RecAudioQueue.refreshRowButtons();
                }
                // โหลดหน้าใหม่เพื่อเติมรายการ (pagination ต้องการ item แทน)
                loadRecordings();
            } catch (err) {
                alert(I18n.t('rec.deleteFail') + (err.detail || err.message || err));
            }
        }

        // === Bulk selection (admin) ===

        // อัพเดตสถานะการเลือกเมื่อติ๊ก checkbox ของแถวใดแถวหนึ่ง
        function onRowSelectChange(id, checked) {
            if (checked) _selectedIds.add(id);
            else _selectedIds.delete(id);
            syncSelectionUI();
        }

        // ติ๊ก/ยกเลิกทุกรายการในหน้าปัจจุบัน
        function onSelectAllChange(checked) {
            if (checked) {
                _allItems.forEach(it => _selectedIds.add(it.id));
            } else {
                _allItems.forEach(it => _selectedIds.delete(it.id));
            }
            syncSelectionUI();
        }

        // ล้างการเลือกทั้งหมด
        function clearSelection() {
            _selectedIds.clear();
            syncSelectionUI();
        }

        // sync checkbox state ทุกแถว + ปุ่ม/ตัวนับในแถบเลือก ให้ตรง _selectedIds
        // (เรียกหลัง re-render ทุกครั้ง เพื่อ preserve สถานะการเลือกตอน auto-refresh)
        function syncSelectionUI() {
            // 1) sync checkbox + highlight ของแต่ละแถวที่อยู่ในหน้านี้
            const container = document.getElementById('recordings-list');
            const checkboxes = container ? container.querySelectorAll('.rec-row-select') : [];
            checkboxes.forEach(cb => {
                const id = cb.getAttribute('data-rec-id');
                const sel = _selectedIds.has(id);
                cb.checked = sel;
                const row = cb.closest('.feed-item');
                if (row) row.classList.toggle('rec-selected', sel);
            });
            // ตัด id ที่ไม่ได้อยู่ใน DOM ออกจาก set (เช่นเปลี่ยนหน้า/กรอง) — ยกเว้นที่ยังคงเลือกอยู่
            // (เก็บไว้ตามเดิมเพื่อรองรับการเลือกข้ามหน้า; ลบเฉพาะที่ DOM มองไม่เห็นจริง ๆ ไม่จำเป็น
            //  เพราะ syncSelectionUI อ้างอิง _selectedIds โดยตรงอยู่แล้ว)

            // 2) สถานะ checkbox "เลือกทั้งหมด" (checked/indeterminate/unchecked)
            const selectAllCb = document.getElementById('rec-select-all');
            if (selectAllCb) {
                const visibleIds = _allItems.map(it => it.id);
                const selectedVisible = visibleIds.filter(id => _selectedIds.has(id));
                if (selectedVisible.length === 0) {
                    selectAllCb.checked = false; selectAllCb.indeterminate = false;
                } else if (selectedVisible.length === visibleIds.length && visibleIds.length > 0) {
                    selectAllCb.checked = true; selectAllCb.indeterminate = false;
                } else {
                    selectAllCb.checked = false; selectAllCb.indeterminate = true;
                }
            }

            // 3) ตัวนับ + ปุ่มลบ
            const n = _selectedIds.size;
            const countEl = document.getElementById('rec-selected-count');
            if (countEl) countEl.textContent = n === 0 ? 'เลือก 0 รายการ' : `เลือก ${n} รายการ`;
            const delBtn = document.getElementById('rec-bulk-delete-btn');
            if (delBtn) {
                delBtn.disabled = (n === 0);
                delBtn.textContent = `🗑 ลบรายการที่เลือก (${n})`;
            }
        }

        // ลบรายการที่เลือกทั้งหมดในครั้งเดียว (admin เท่านั้น)
        async function bulkDeleteSelected() {
            const ids = Array.from(_selectedIds);
            if (!ids.length) return;
            if (!Auth.isAdmin()) { showToast(I18n.t('rec.deleteAdminOnly')); return; }
            if (!confirm(I18n.t('rec.deleteConfirm', ids.length))) return;
            const delBtn = document.getElementById('rec-bulk-delete-btn');
            if (delBtn) { delBtn.disabled = true; delBtn.textContent = I18n.t('rec.deleting'); }
            try {
                const result = await API.recordings.bulkDelete(ids);
                // กำจัดรายการที่ถูกลบออกจาก player/คิว
                const deletedIds = new Set(result.deleted_ids || ids);
                if (typeof RecAudioQueue !== 'undefined') {
                    if (RecAudioQueue.current && deletedIds.has(RecAudioQueue.current.id)) {
                        RecAudioQueue.current = null;
                        try { RecAudioQueue._audio.pause(); RecAudioQueue._audio.removeAttribute('src'); RecAudioQueue._audio.load(); } catch (e) {}
                        RecAudioQueue._isPlaying = false;
                    }
                    RecAudioQueue.pending = RecAudioQueue.pending.filter(p => !deletedIds.has(p.id));
                    RecAudioQueue.refreshRowButtons();
                }
                _selectedIds.clear();
                _total = Math.max(0, _total - (result.deleted_count || 0));
                const nf = (result.not_found_ids && result.not_found_ids.length) ? result.not_found_ids.length : 0;
                showToast(I18n.t('rec.deletedCount', result.deleted_count || 0, nf));
                loadRecordings();
            } catch (err) {
                alert(I18n.t('rec.deleteFail') + (err.detail || err.message || err));
                syncSelectionUI();
            }
        }

        // === Auto-refresh logic ===

        // ตรวจสอบว่าสภาพแวดล้อมปัจจุบัน "ปลอดภัย" ที่จะ auto-refresh หรือไม่
        // - ต้องอยู่หน้า 1 (เพื่อไม่ให้กระทบสถานะผู้ใช้ที่เลื่อนไปดูหน้าอื่น)
        // - ไม่กำลังค้นหา/กรอง (filter ปกติโอเค แต่ search จะกวนผลลัพธ์)
        // - ไม่กำลังโหลดอยู่แล้ว
        const FREQ_TOLERANCE_MHZ = 0.005; // ±5 kHz (ต้องตรงกับ backend FREQ_TOLERANCE_KHZ)

        function canAutoRefresh() {
            if (_loading) return false;
            if (_page !== 1) return false;
            const search = document.getElementById('search-input').value.trim();
            if (search) return false;
            const freq = document.getElementById('filter-frequency').value;
            if (freq) return false;
            return true;
        }

        // Silent refresh: โหลดใหม่ด้วย reconciliation เพื่อ preserve <audio>
        function autoRefresh() {
            if (!canAutoRefresh()) return;
            loadRecordings();
        }

        function startAutoRefresh() {
            stopAutoRefresh();
            _refreshTimer = setInterval(autoRefresh, REFRESH_INTERVAL_MS);
        }

        function stopAutoRefresh() {
            if (_refreshTimer) {
                clearInterval(_refreshTimer);
                _refreshTimer = null;
            }
        }

        // หยุด polling เมื่อ tab ไม่ visible, resume เมื่อกลับมา
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopAutoRefresh();
            } else {
                autoRefresh();
                startAutoRefresh();
            }
        });

        // === Real-time via WebSocket ===
        function setupWS() {
            try {
                WS.connect();
                WS.on('new_recording', (rec) => {
                    // ต้องอยู่หน้า 1, ไม่มี search, filter ต้องตรง
                    if (!canAutoRefresh()) return;
                    const filterVal = document.getElementById('filter-source').value;
                    const recSource = rec.source || 'auto';
                    if (filterVal && filterVal !== recSource) return;
                    // ตรวจ frequency filter (ถ้าเลือกไว้) ด้วย tolerance ±5 kHz
                    const freqFilter = document.getElementById('filter-frequency').value;
                    if (freqFilter) {
                        const recMhz = rec.frequency_mhz || (rec.frequency ? rec.frequency / 1e6 : null);
                        if (recMhz == null || Math.abs(recMhz - parseFloat(freqFilter)) > FREQ_TOLERANCE_MHZ) {
                            return; // ไม่ตรงความถี่ที่เลือก → ไม่ prepend
                        }
                    }
                    // ตรวจ device filter (ถ้าเลือกไว้)
                    const devFilter = document.getElementById('filter-device').value;
                    if (devFilter) {
                        const recDevId = rec.device_id ? String(rec.device_id) : '';
                        if (recDevId !== devFilter) return;
                    }

                    // กัน duplicate
                    if (_recCache.has(rec.id)) return;

                    _total = (_total || 0) + 1;
                    const container = document.getElementById('recordings-list');
                    // ลบ placeholder "ยังไม่มีรายการบันทึก" ถ้ามี
                    const placeholder = container.querySelector('p.text-muted');
                    if (placeholder && !placeholder.closest('.feed-item')) placeholder.remove();

                    // prepend แถวใหม่ด้านบน
                    const wrapper = document.createElement('div');
                    wrapper.innerHTML = recHTML(rec).trim();
                    container.insertBefore(wrapper.firstChild, container.firstChild);

                    _recCache.set(rec.id, rec);
                    _allItems.unshift(rec);
                    // ถ้าเกิน page size ให้ตัดท้าย
                    if (_allItems.length > _pageSize) {
                        const removed = _allItems.pop();
                        if (removed) {
                            const tailRow = document.getElementById(`rec-${removed.id}`);
                            if (tailRow) tailRow.remove();
                            _recCache.delete(removed.id);
                        }
                    }
                    updateCountAndPagination();
                    if (typeof RecAudioQueue !== 'undefined') RecAudioQueue.onNewRecording(rec);
                    syncSelectionUI();
                });
            } catch (e) {
                console.warn('WS setup failed, relying on polling only:', e);
            }
        }

        // === Auto-play Queue Coordinator ===
        // ระบบคิวเล่นเสียงรายการล่าสุดอัตโนมัติ ควบคุมด้วย <audio> อันเดียวในแถบ player ลอยด้านล่าง
        const RecAudioQueue = {
            enabled: false,       // เปิด auto-play (บันทึกใน localStorage)
            pending: [],          // [{id, recorded_at, url, label}] เก่า→ใหม่ ที่รอเล่น
            current: null,        // ข้อมูลรายการที่โหลดอยู่ใน player หรือ null
            _isPlaying: false,
            _programmatic: false, // flag กัน loop เวลา play/pause ด้วยโค้ด
            _audio: null,

            init() {
                this._audio = document.getElementById('rec-player-audio');
                this.enabled = localStorage.getItem('rec_autoplay') === '1';
                this._audio.addEventListener('play', () => {
                    if (this._programmatic) return;
                    this._isPlaying = true; this.refreshRowButtons();
                });
                this._audio.addEventListener('pause', () => {
                    if (this._programmatic) return;
                    this._isPlaying = false; this.refreshRowButtons();
                });
                this._audio.addEventListener('ended', () => this.onAudioEnded());
                this._audio.addEventListener('error', () => this.onAudioEnded());
                this.refreshRowButtons();
            },

            // สร้าง item สำหรับ player จาก record object
            _itemFromRec(rec) {
                const hasAudio = rec.has_audio != null ? rec.has_audio : (!!(rec.audio_file_name || rec.url) && !rec.audio_deleted);
                const url = hasAudio ? (rec.audio_file_name ? '/recordings/' + rec.audio_file_name : (rec.url || '')) : '';
                const freq = rec.frequency_mhz ? rec.frequency_mhz.toFixed(4) + ' MHz' : '';
                const mode = rec.mode || '';
                const t = rec.recorded_at ? formatTime(rec.recorded_at, getUserTimezone()) : '';
                const label = `${freq} ${mode} ${t}`.trim();
                return { id: rec.id, recorded_at: rec.recorded_at || rec.timestamp || '', url, label };
            },

            // เปิด/ปิด auto-play
            toggleAutoplay() {
                this.enabled = !this.enabled;
                localStorage.setItem('rec_autoplay', this.enabled ? '1' : '0');
                if (!this.enabled) {
                    // ปิด → ล้างคิวทั้งหมด + pause เสียงปัจจุบัน (ผู้ใช้ฟังอิสระ)
                    this.pending = [];
                    if (this.current && this._isPlaying) {
                        this._programmatic = true;
                        try { this._audio.pause(); } catch (e) {}
                        this._isPlaying = false;
                        this._programmatic = false;
                    }
                } else {
                    // เปิด → คิวเริ่มว่าง รอของใหม่; ถ้ายังไม่มีอะไรเล่นอยู่ ให้ jumpstart เล่นรายการล่าสุดที่เห็น
                    if (!this.current && _allItems.length > 0) {
                        const item = this._itemFromRec(_allItems[0]);
                        if (item.url) this._loadAndPlay(item);
                    }
                }
                this.refreshRowButtons();
            },

            // กดปุ่ม ▶/⏸ ที่แถวรายการ (หรือปุ่มในแถบ player ผ่าน toggleCurrentPlayPause)
            toggleRow(id) {
                const rec = _recCache.get(id);
                if (!rec) return;
                if (this.current && this.current.id === id) {
                    // เป็นรายการปัจจุบัน → สลับ play/pause
                    if (this._isPlaying) {
                        this._programmatic = true;
                        try { this._audio.pause(); } catch (e) {}
                        this._isPlaying = false;
                        this._programmatic = false;
                    } else {
                        this._playInternal();
                    }
                    this.refreshRowButtons();
                    return;
                }
                // โหลดรายการใหม่ → เป็นการ skip-ahead: ล้างคิวที่เก่ากว่าหรือเท่ากัน (เฉพาะเมื่อเปิด auto-play)
                const item = this._itemFromRec(rec);
                if (!item.url) return;
                if (this.enabled) {
                    const t = item.recorded_at;
                    this.pending = this.pending.filter(p => p.recorded_at > t);
                }
                this._loadAndPlay(item);
            },

            toggleCurrentPlayPause() {
                if (!this.current) return;
                this.toggleRow(this.current.id);
            },

            _playInternal() {
                this._programmatic = true;
                const p = this._audio.play();
                if (p && p.then) {
                    p.then(() => { this._isPlaying = true; this._programmatic = false; this.refreshRowButtons(); })
                     .catch(() => { this._programmatic = false; this.refreshRowButtons(); });
                } else {
                    this._isPlaying = true; this._programmatic = false;
                }
            },

            _loadAndPlay(item) {
                this.current = item;
                this._programmatic = true;
                try { this._audio.src = item.url; } catch (e) {}
                const p = this._audio.play();
                if (p && p.then) {
                    p.then(() => { this._isPlaying = true; this._programmatic = false; this.refreshRowButtons(); })
                     .catch((e) => { this._programmatic = false; console.warn('play() blocked:', e); this.refreshRowButtons(); });
                } else {
                    this._isPlaying = true; this._programmatic = false;
                }
                this.refreshRowButtons();
            },

            onAudioEnded() {
                // ถ้าเปิด auto-play และยังมีคิว → เล่นตัวถัดไป (เก่าสุดที่รอ)
                if (this.enabled && this.pending.length > 0) {
                    const next = this.pending.shift();
                    this._loadAndPlay(next);
                    return;
                }
                // หมดแล้ว → เคลียร์และซ่อนแถบ
                this._isPlaying = false;
                this.current = null;
                this.refreshRowButtons();
            },

            // เรียกโดย WS handler เมื่อมีรายการใหม่เข้ามา
            onNewRecording(rec) {
                if (!this.enabled) return;            // ปิดอยู่ → ไม่สะสมคิว
                const item = this._itemFromRec(rec);
                if (!item.url) return;
                this.pending.push(item);
                if (!this.current) {
                    // ไม่มีอะไรเล่นอยู่ → เล่นทันที
                    const next = this.pending.shift();
                    this._loadAndPlay(next);
                } else {
                    this.refreshRowButtons();
                }
            },

            // sync ปุ่มทุกแถว + ไฮไลต์ + อัพเดตแถบ player/ป้ายคิว
            refreshRowButtons() {
                const curId = this.current ? this.current.id : null;
                document.querySelectorAll('.feed-item[data-rec-id]').forEach(row => {
                    const id = row.getAttribute('data-rec-id');
                    const isCurrent = (id === curId);
                    const btn = row.querySelector('.rec-play-btn');
                    if (btn) btn.textContent = (isCurrent && this._isPlaying) ? '⏸' : '▶';
                    if (isCurrent) row.classList.add('rec-playing');
                    else row.classList.remove('rec-playing');
                });
                this._refreshUI();
            },

            _refreshUI() {
                const btn = document.getElementById('rec-autoplay-btn');
                const icon = document.getElementById('rec-autoplay-icon');
                const label = document.getElementById('rec-autoplay-label');
                const badge = document.getElementById('rec-queue-badge');
                if (this.enabled) {
                    btn.classList.add('on'); icon.textContent = '🔊';
                } else {
                    btn.classList.remove('on'); icon.textContent = '🔇';
                }
                label.textContent = I18n.t('rec.autoPlay');
                if (this.pending.length > 0) {
                    badge.textContent = I18n.t('rec.queue', this.pending.length);
                    badge.classList.add('has');
                } else {
                    badge.textContent = '';
                    badge.classList.remove('has');
                }
                const bar = document.getElementById('rec-player-bar');
                const pp = document.getElementById('rec-player-pp');
                const info = document.getElementById('rec-player-info');
                const appMain = document.querySelector('.app-main');
                if (this.current) {
                    bar.classList.add('visible');
                    if (appMain) appMain.classList.add('rec-has-player');
                    pp.textContent = this._isPlaying ? '⏸' : '▶';
                    info.innerHTML = `<span class="pi-title">${this.current.label || '--'}</span>`;
                } else {
                    bar.classList.remove('visible');
                    if (appMain) appMain.classList.remove('rec-has-player');
                }
            },
        };

        // === Device dropdown ===
        async function loadDevices() {
            const select = document.getElementById('filter-device');
            if (!select) return;
            const currentVal = select.value;
            try {
                const data = await API.sdr.devices.list();
                const items = data.devices || data || [];
                select.innerHTML = '<option value="">ทุกอุปกรณ์</option>';
                for (const item of items) {
                    const opt = document.createElement('option');
                    opt.value = item.id;
                    opt.textContent = item.name;
                    select.appendChild(opt);
                }
                if (currentVal && Array.from(select.options).some(o => o.value === currentVal)) {
                    select.value = currentVal;
                }
            } catch (e) {
                console.warn('Failed to load devices:', e);
            }
        }

        // === Bootstrap ===
        // แสดงแถบเลือก/ลบรวม เฉพาะผู้ดูแลระบบ
        if (Auth.isAdmin()) {
            const selBar = document.getElementById('rec-select-bar');
            if (selBar) selBar.hidden = false;
        }
        loadDevices();      // โหลดรายการอุปกรณ์สำหรับ dropdown
        loadFrequencies();  // โหลดรายการความถี่สำหรับ dropdown
        resetAndLoad();
        startAutoRefresh();
        setupWS();

        // Re-render recordings list when language changes
        document.addEventListener('languagechange', () => {
            if (_allItems && _allItems.length) resetAndLoad();
        });
        RecAudioQueue.init();

        // ทำความสะอาดตอนปล่อยหน้า
        window.addEventListener('beforeunload', () => {
            stopAutoRefresh();
            try { WS.disconnect(); } catch (e) {}
        });
    </script>
</body>
