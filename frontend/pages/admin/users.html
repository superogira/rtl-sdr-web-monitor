<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Users - RTL-SDR Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/dseg@0.46.0/css/dseg.css" rel="stylesheet">
    <script src="/js/i18n.js?v=1"></script>
    <link rel="stylesheet" href="/css/app.css?v=18">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('ui_theme');
                if (t === 'v2') document.documentElement.setAttribute('data-theme', 'v2');
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <a href="/dashboard" class="header-logo">📡 RTL-SDR Monitor</a>
            </div>
            <div class="header-right">
                <button class="lang-toggle-btn" onclick="I18n.toggle()" data-i18n="lang.toggle">🌐 EN</button>
                <a href="/settings" class="btn btn-sm" data-i18n="nav.settings">⚙️ ตั้งค่า</a>
                <button class="btn btn-sm" onclick="Auth.logout()" data-i18n="nav.logout">ออกจากระบบ</button>
            </div>
        </header>
        <div class="app-main" style="padding: 2rem; overflow-y: auto;">
            <h2 style="margin-bottom: 1rem;">👥 จัดการผู้ใช้</h2>
            <div id="users-list" class="text-muted">กำลังโหลด...</div>
        </div>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        if (!Auth.isAuthenticated() || !Auth.isAdmin()) {
            window.location.href = '/dashboard';
        }
        // TODO: Load and manage users
        document.getElementById('users-list').innerHTML = '<p>Admin user management - Coming soon</p>';
    </script>
</body>
</html>
