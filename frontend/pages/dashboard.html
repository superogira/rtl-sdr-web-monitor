<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - RTL-SDR Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <!-- DSEG7 Classic (7-segment display font for Theme V2). Loaded from CDN; falls back to monospace if offline. -->
    <link href="https://cdn.jsdelivr.net/npm/dseg@0.46.0/css/dseg.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css?v=19">
    <script>
        // Apply saved theme before first paint to avoid a flash of the wrong theme.
        (function () {
            try {
                var t = localStorage.getItem('ui_theme');
                if (t === 'v2') document.documentElement.setAttribute('data-theme', 'v2');
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <div class="app-container">
        <!-- === Header === -->
        <header class="app-header">
            <div class="header-left">
                <div class="header-logo">
                    <span class="status-dot" id="connection-status"></span>
                    <span>📡 RTL-SDR Monitor</span>
                </div>
            </div>
            <div class="header-center">
                <div class="mode-selector" id="mode-selector">
                    <button class="mode-btn active" data-mode="FM">FM</button>
                    <button class="mode-btn" data-mode="AM">AM</button>
                    <button class="mode-btn" data-mode="USB">USB</button>
                    <button class="mode-btn" data-mode="LSB">LSB</button>
                </div>
                <div class="bw-selector" id="bw-buttons">
                    <button class="bw-btn" data-bw="1800" title="SSB Narrow (1.8 kHz)">1.8k</button>
                    <button class="bw-btn" data-bw="2400" title="SSB Voice (2.4 kHz) - USB/LSB voice">2.4k</button>
                    <button class="bw-btn" data-bw="3000" title="SSB Wide (3 kHz)">3k</button>
                    <button class="bw-btn" data-bw="6000" title="Narrow (6 kHz) - NBFM/CW">6k</button>
                    <button class="bw-btn active" data-bw="12000" title="Normal (12 kHz) - NBFM voice">12k</button>
                    <button class="bw-btn" data-bw="25000" title="Wide (25 kHz)">25k</button>
                    <button class="bw-btn" data-bw="50000" title="Extra Wide (50 kHz)">50k</button>
                    <button class="bw-btn" data-bw="200000" title="Broadcast (200 kHz) - WBFM">200k</button>
                </div>
            </div>
            <div class="header-right">
                <span id="ws-status" style="font-size:0.7rem;color:#f66;margin-right:4px;">WS: ⚪</span>
                <button class="btn btn-sm" id="btn-connect" onclick="App.connectSDR()">🔗 เชื่อมต่อ</button>
                <button class="btn btn-sm" id="btn-stream" onclick="App.toggleStream()" style="display:none;">▶ รับสัญญาณ</button>
                <button class="btn btn-sm btn-listen" id="btn-listen" onclick="LiveAudio.toggle()">🔈 ฟังสด</button>
                <span id="listen-indicator" style="display:none; font-size:0.75rem; color:var(--accent-green);" title="กำลังฟังสด">●</span>
                <span id="audio-status" style="font-size:0.7rem;"></span>
                <span id="listener-count" style="font-size:0.75rem; color:var(--text-muted);"></span>
                <span class="text-muted" id="user-display" style="font-size:0.8rem;">👤</span>
                <span class="theme-switch" role="group" title="สลับ Theme">
                    <button id="theme-btn-classic" onclick="App.setTheme('classic')">Classic</button>
                    <button id="theme-btn-v2" onclick="App.setTheme('v2')">V2</button>
                </span>
                <a href="/settings" class="btn btn-sm" id="btn-settings">⚙️ ตั้งค่า</a>
                <button class="btn btn-sm" onclick="Auth.logout()">ออกจากระบบ</button>
            </div>
        </header>

        <!-- === Main Dashboard === -->
        <div class="app-main">
            <div class="dashboard">
                <!-- Left Panel: Waterfall + Signal -->
                <div class="panel-left">
                    <!-- Waterfall Display -->
                    <div class="waterfall-container">
                        <canvas id="waterfall-canvas"></canvas>
                        <!-- Hover frequency tooltip (shown after 0.5s dwell) -->
                        <div id="waterfall-hover-freq" class="waterfall-hover-freq"></div>
                        <!-- Center frequency marker (triangle pointing down + vertical line) -->
                        <!-- center-freq-marker removed: label pill from grid
                             already marks center frequency clearly. Removing
                             triangle avoids overlap with freq label at top. -->
                        <div class="waterfall-overlay">
                            <span id="freq-low">144.000 MHz</span>
                            <span id="freq-center" class="text-accent">145.500 MHz</span>
                            <span id="freq-high">147.000 MHz</span>
                        </div>
                    </div>

                    <!-- Signal Meter -->
                    <div class="signal-meter">
                        <span class="label">SIG</span>
                        <div class="bars" id="signal-bars">
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                        </div>
                        <span class="dbm" id="signal-dbm">--- dBm</span>
                    </div>

                    <!-- Bookmarks -->
                    <div class="bookmark-list" id="bookmark-list">
                        <div style="padding:4px 8px; display:flex; justify-content:space-between; align-items:center;">
                            <span style="font-size:0.8rem; font-weight:600; color:var(--text-secondary);">🔖 Bookmarks</span>
                            <button class="btn btn-sm" onclick="App.showAddBookmark()">+ เพิ่ม</button>
                        </div>
                        <div id="bookmarks-container">
                            <!-- Bookmark items rendered here -->
                        </div>
                    </div>
                </div>

                <!-- Collapse button (OUTSIDE panel-right so it stays visible when collapsed) -->
                <button class="panel-collapse-btn" id="panel-collapse-btn" title="ย่อ/ขยายแผงขวา">⬆</button>

                <!-- Right Panel: Clock + Freq List + Feed -->
                <div class="panel-right" id="panel-right">
                    <!-- Clock Widget -->
                    <div class="clock-widget">
                        <div class="clock-time" id="clock-time">--:--:--</div>
                        <div class="clock-date" id="clock-date">-- ๆๆๆๆ ๆๆๆ</div>
                        <div class="clock-day" id="clock-day">วันๆๆๆๆๆ</div>
                        <!-- Active recording indicator (auto from live listening + background jobs) -->
                        <div class="recording-status-list" id="recording-status-list"></div>
                    </div>

                    <!-- Bookmarked Frequency List -->
                    <div class="freq-list">
                        <div class="freq-list-header">
                            <span>📻 ความถี่ที่บันทึกไว้</span>
                            <span class="text-muted" id="freq-count">0</span>
                        </div>
                        <div id="freq-list-container">
                            <!-- Freq items rendered here -->
                        </div>
                    </div>

                    <!-- Live Feed -->
                    <div class="live-feed">
                        <div class="live-feed-header">
                            <span>📋 รายการล่าสุด</span>
                            <button class="btn btn-sm" onclick="App.viewAllRecordings()">ดูทั้งหมด</button>
                        </div>
                        <div id="live-feed-container">
                            <!-- Feed items rendered here -->
                            <div class="text-center text-muted p-2" style="font-size:0.8rem;">
                                ยังไม่มีรายการบันทึก
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- === Footer: Radio Control === -->
        <footer class="app-footer">
            <!-- Row 1: Frequency + Tune + Step -->
            <div class="radio-row">
                <div class="radio-controls">
                    <button class="radio-btn" id="btn-tune-down-coarse" title="ลดความถี่ (coarse)">◀◀</button>
                    <button class="radio-btn" id="btn-tune-down" title="ลดความถี่">◀</button>
                </div>
                <div class="radio-display" id="freq-display-box" title="คลิกเพื่อพิมพ์ความถี่ที่จะฟัง (VFO)">
                    <div class="freq-display" id="freq-display">
                        1 4 5 . 5 0 0 <span class="decimal">0</span>
                    </div>
                    <div class="radio-info">
                        <div class="info-row">
                            <span class="label">MODE:</span>
                            <span class="value" id="radio-mode">FM</span>
                        </div>
                        <div class="info-row">
                            <span class="label">BW:</span>
                            <span class="value" id="radio-bw">2.048M</span>
                        </div>
                    </div>
                </div>
                <div class="radio-controls">
                    <button class="radio-btn" id="btn-tune-up" title="เพิ่มความถี่">▶</button>
                    <button class="radio-btn" id="btn-tune-up-coarse" title="เพิ่มความถี่ (coarse)">▶▶</button>
                </div>

                <!-- Step Size Selector -->
                <div class="step-selector">
                    <span class="step-label">STEP</span>
                    <div class="step-buttons" id="step-buttons">
                        <button class="step-btn" data-step="1000">1k</button>
                        <button class="step-btn" data-step="5000">5k</button>
                        <button class="step-btn" data-step="12500">12.5k</button>
                        <button class="step-btn active" data-step="25000">25k</button>
                        <button class="step-btn" data-step="100000">100k</button>
                        <button class="step-btn" data-step="1000000">1M</button>
                    </div>
                </div>

                <!-- Sample Rate Selector (admin only) -->
                <div class="step-selector">
                    <span class="step-label">SRATE</span>
                    <div class="step-buttons" id="srate-buttons">
                        <button class="step-btn" data-srate="250000">250k</button>
                        <button class="step-btn" data-srate="320000">320k</button>
                        <button class="step-btn" data-srate="1024000">1M</button>
                        <button class="step-btn" data-srate="1536000">1.5M</button>
                        <button class="step-btn active" data-srate="2048000">2M</button>
                        <button class="step-btn" data-srate="2400000">2.4M</button>
                    </div>
                </div>

                <!-- Center Frequency Button (admin only) -->
                <div class="step-selector">
                    <span class="step-label">CENTER</span>
                    <div class="step-buttons">
                        <button class="step-btn" id="btn-center-freq" title="ตั้งความถี่กลาง (Center Frequency) ของฮาร์ดแวร์ SDR">📻 SET</button>
                    </div>
                </div>

                <!-- Waterfall Auto Range Toggle -->
                <div class="step-selector">
                    <span class="step-label">WF</span>
                    <div class="step-buttons" id="wf-auto-buttons">
                        <button class="step-btn" id="wf-auto-btn" title="ปรับ dB range อัตโนมัติแบบต่อเนื่อง (เหมือน OpenWebRX)">🎚️ AUTO</button>
                    </div>
                </div>

                <!-- Record toggle -->
                <div class="radio-controls">
                    <button class="radio-btn" id="btn-record" title="บันทึก (กดอีกครั้งเพื่อหยุด)">⏺</button>
                </div>

                <!-- Volume control -->
                <div class="volume-control" id="volume-control">
                    <span class="volume-icon" id="volume-icon">🔊</span>
                    <input type="range" id="volume-slider" min="0" max="100" value="80"
                           title="ระดับเสียง" />
                    <span class="volume-pct" id="volume-pct">80%</span>
                </div>
            </div>

            <!-- Row 2: Gain + Squelch (with numeric inputs + +/- buttons) -->
            <div class="radio-row radio-sliders">
                <div class="slider-group" id="gain-slider-group">
                    <span class="slider-label">GAIN</span>
                    <button class="step-mini-btn" data-target="gain" data-delta="-1" title="ลด Gain ลง 1">−</button>
                    <input type="range" id="gain-slider" min="0" max="50" value="30" step="1">
                    <button class="step-mini-btn" data-target="gain" data-delta="1" title="เพิ่ม Gain ขึ้น 1">+</button>
                    <input type="number" id="gain-input" min="0" max="50" value="30" step="1"
                           style="width:48px; padding:2px 4px; font-size:0.72rem; background:var(--surface-1);
                                  border:1px solid var(--border); border-radius:3px; color:var(--text-primary);
                                  font-family:'JetBrains Mono', monospace;" title="กรอกค่า Gain เอง">
                    <span style="font-size:0.7rem; color:var(--text-secondary);">dB</span>
                </div>
                <div class="slider-group">
                    <span class="slider-label">SQL</span>
                    <button class="step-mini-btn" data-target="squelch" data-delta="-1" title="ลด SQL ลง 1">−</button>
                    <input type="range" id="squelch-slider" min="-120" max="-20" value="-70" step="1">
                    <button class="step-mini-btn" data-target="squelch" data-delta="1" title="เพิ่ม SQL ขึ้น 1">+</button>
                    <input type="number" id="squelch-input" min="-120" max="-20" value="-70" step="1"
                           style="width:54px; padding:2px 4px; font-size:0.72rem; background:var(--surface-1);
                                  border:1px solid var(--border); border-radius:3px; color:var(--text-primary);
                                  font-family:'JetBrains Mono', monospace;" title="กรอกค่า Squelch เอง">
                    <span style="font-size:0.7rem; color:var(--text-secondary);">dB</span>
                </div>
            </div>

            <!-- Row 3: Frequency Correction (PPM) — Admin Only -->
            <div class="radio-row radio-sliders" id="ppm-slider-group">
                <div class="slider-group">
                    <span class="slider-label">PPM</span>
                    <button class="step-mini-btn" data-target="ppm" data-delta="-1" title="ลด PPM ลง 1">−</button>
                    <input type="range" id="ppm-slider" min="-100" max="100" value="0" step="1"
                           title="ปรับ Frequency Correction (PPM) เพื่อให้ waterfall ตรงกับความถี่จริง">
                    <button class="step-mini-btn" data-target="ppm" data-delta="1" title="เพิ่ม PPM ขึ้น 1">+</button>
                    <input type="number" id="ppm-input" min="-200" max="200" value="0" step="1"
                           style="width:60px; padding:2px 4px; font-size:0.72rem; background:var(--surface-1);
                                  border:1px solid var(--border); border-radius:3px; color:var(--text-primary);
                                  font-family:'JetBrains Mono', monospace;" title="กรอกค่า PPM เอง">
                    <span style="font-size:0.7rem; color:var(--text-secondary);" title="Frequency Correction ในหน่วย Parts Per Million">ppm</span>
                </div>
            </div>
        </footer>
    </div>

    <script src="/js/api.js?v=9"></script>
    <script src="/js/auth.js?v=5"></script>
    <script src="/js/websocket.js?v=5"></script>
    <script src="/js/audio.js?v=6"></script>
    <script src="/js/app.js?v=31"></script>
    <script src="/js/dashboard_jobs.js?v=3"></script>
</body>
</html>
